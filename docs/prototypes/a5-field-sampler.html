<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'"><title>A5现场分段采样器</title>
<style>body{font:16px/1.6 system-ui;background:#f4f7f6;color:#244039;padding:15px;max-width:850px;margin:auto}label{display:block}input{font:inherit;width:95%;padding:8px}button{font:inherit;min-height:44px;padding:8px;margin:5px 3px;border:1px solid #b7cdc2;background:white;border-radius:8px}p{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}.box{background:white;padding:15px;margin:12px 0;border-radius:10px}</style>
<h1>A5现场分段采样器</h1><p>本页不连接ERP，不会出入库或退货。用第二台设备计时；单机切换会引入操作延迟，须记录。相机、查询、队列反馈、保存分开统计。关闭页面会清空，请先导出。</p>
<div class="box"><label>机型 / Android / App或WebView版本 / 网络<input id="environment" placeholder="每组填写真实环境"></label><label>样本参考（可用编号代替流程卡）<input id="reference" placeholder="样本1"></label><button data-mark="camera_start">①开始相机识别</button><button data-mark="recognised">②码已识别</button><button data-mark="queue_visible">③本地队列显示</button><button data-mark="lookup_done">④查询资料显示</button><button data-mark="save_start">⑤开始保存</button><button data-mark="save_done">⑥保存收到结果</button><button id="finish">记录本样本</button><button id="reset">清除当前样本（不清历史）</button><p id="state" aria-live="polite"></p></div><div class="box"><button id="export">导出采样JSON</button><pre id="results">尚无记录。未计时段不填0。</pre></div>
<script>const rows=[];let marks={};const get=id=>document.getElementById(id);document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{marks[b.dataset.mark]=performance.now();get('state').textContent='已记录：'+Object.keys(marks).join(' → ')});function duration(a,b){return marks[a]!=null&&marks[b]!=null&&marks[b]>=marks[a]?Math.round((marks[b]-marks[a])*100)/100:null}function stats(key){const list=rows.map(x=>x[key]).filter(x=>x!=null).sort((a,b)=>a-b);return list.length?{samples:list.length,p50:list[Math.ceil(.5*list.length)-1],p95:list[Math.ceil(.95*list.length)-1],max:list.at(-1)}:{samples:0,status:'未测'}}function data(){return{environment:get('environment').value,manual_timing:true,metrics:Object.fromEntries(['camera_ms','queue_ms','lookup_ms','save_ms'].map(k=>[k,stats(k)])),rows}}get('finish').onclick=()=>{if(!Object.keys(marks).length)return;rows.push({reference:get('reference').value||String(rows.length+1),camera_ms:duration('camera_start','recognised'),queue_ms:duration('recognised','queue_visible'),lookup_ms:duration('recognised','lookup_done'),save_ms:duration('save_start','save_done')});marks={};get('state').textContent='已记录'+rows.length+'样本';get('results').textContent=JSON.stringify(data(),null,2)};get('reset').onclick=()=>{marks={};get('state').textContent='当前计时已清除'};get('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}));a.download='a5-field-samples.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
